name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OPENST133_NO_HARDWARE: "1"

jobs:
  versions:
    name: release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the tag against the project versions
        run: python3 -I packaging/ci/check_version.py "$GITHUB_REF_NAME"

  sdist:
    name: source distribution
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libusb-1.0-0-dev
          python3 -m pip install build==1.3.0
      - name: Build the sdist
        run: python3 -m build --sdist --outdir dist
      - name: Install the sdist and smoke-test it
        run: |
          python3 -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install dist/openst133-*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/python" -I "$GITHUB_WORKSPACE/packaging/ci/check_wheel.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openst133-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Python wheels
    needs: versions
    uses: ./.github/workflows/wheels.yml

  pypi:
    name: Publish to PyPI
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/openst133/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: openst133-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: openst133-*
          merge-multiple: true
      - name: Write SHA256SUMS and create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/release/publish.sh "$GITHUB_REF_NAME" dist
